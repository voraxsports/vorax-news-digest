name: Vorax News Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"  # 08:00 São Paulo (UTC-3)
    - cron: "0 21 * * *"  # 18:00 São Paulo (UTC-3)

concurrency:
  group: vorax-news-digest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_POSTS_PER_RUN: "4"
          MAX_VLR_PER_RUN: "2"
          MAX_THESPIKE_PER_RUN: "2"
          LOG_LEVEL: "INFO"
          TRANSLATE_PT: "1"
          TRANSLATE_ONLY_VLR: "1"
          EMBED_COLOR: "0"
          BRAND_NAME: "Vorax eSports"
          FOOTER_TEXT: "Vorax eSports • Notícias da Comunidade"
          VORAX_LOGO_URL: "https://cdn.discordapp.com/attachments/1440760869964484738/1469322383449002004/vorax_icon_alt_on-ghost.png.png"
        run: python bot_noticias_digest_ptbr.py

      - name: Commit state (anti-duplicado)
        run: |
          git config user.name "vorax-bot"
          git config user.email "bot@vorax.local"
          git add posted_cache.json translate_cache.json || true
          git diff --cached --quiet || git commit -m "chore: update news cache"
          git push
